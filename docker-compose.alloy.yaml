services:
  web:
    image: node:24-bookworm
    working_dir: /workspace
    network_mode: host
    volumes:
      - .:/workspace
    environment:
      IS_ALLOY: ${IS_ALLOY:-false}
      NODE_OPTIONS: --max-old-space-size=8192
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      CI: "true"
    command: bash -lc "corepack enable && pnpm install --no-frozen-lockfile && pnpm exec vite --host 0.0.0.0 --port 9876 --strictPort"
